    ExportTrajectoryProgress progress = 1;
    ExportTrajectoryWarning warning = 2;
    ExportTrajectoryCompleted completed = 3;
    ExportTrajectoryFailed failed = 4;
  }
}

message GetConversationTurnsRequest  { string conversation_id = 1; }
