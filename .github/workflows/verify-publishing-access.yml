name: Verify publishing access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    steps:
      - name: Verify cross-repository token permissions without writing
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PLUGIN_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          checks = [
              ("TAP_TOKEN", "cercano-ai/homebrew-cercano"),
              ("PLUGIN_TOKEN", "cercano-ai/cercano-claude"),
              ("PLUGIN_TOKEN", "cercano-ai/cercano-codex"),
              ("PLUGIN_TOKEN", "cercano-ai/cercano-gemini"),
          ]
          failed = False
          for key, repo in checks:
              token = os.environ.get(key, "")
              if not token:
                  print(f"FAIL {repo}: configured token is missing")
                  failed = True
                  continue
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with opener.open(req, timeout=30) as response:
                      metadata = json.load(response)
                  writable = metadata.get("permissions", {}).get("push") is True
                  print(f"{'PASS' if writable else 'FAIL'} {repo}: reported write access = {writable}")
                  failed |= not writable
              except urllib.error.HTTPError as exc:
                  print(f"FAIL {repo}: HTTP {exc.code}")
                  failed = True
              except (urllib.error.URLError, ValueError):
                  print(f"FAIL {repo}: request or response validation failed")
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY
