name: Update coordinator fixture tests
on:
  push:
    branches: [feat/cross-platform-updates]
    paths:
      - 'source/server/internal/updatecoord/**'
      - 'source/server/pkg/update/**'
      - 'source/server/internal/server/**'
      - 'source/server/internal/localruntime/**'
      - 'source/server/internal/worker/**'
      - 'source/server/internal/compactiongen/**'
      - 'source/server/internal/hostsvc/persistence/**'
      - 'source/server/pkg/agentclient/**'
      - 'source/server/go.mod'
      - 'source/server/go.sum'
      - '.github/workflows/updatecoord-tests.yml'
      - 'efforts/cross-platform-updates/tuf-proof/**'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: |
            source/server/go.sum
            efforts/cross-platform-updates/tuf-proof/go.sum
      - name: Record native platform
        working-directory: source/server
        run: go env GOOS GOARCH
      - name: Native temporary-state and subprocess tests
        working-directory: source/server
        run: go test -count=1 -timeout=2m ./internal/updatecoord/... ./pkg/update
      - name: Windows launch lock tests
        # Only the Windows-specific launch-lock primitives are hermetic on
        # Windows today; do not run the rest of the server suite here.
        if: runner.os == 'Windows'
        working-directory: source/server
        run: go test -count=1 -timeout=2m -run '^TestWindowsLaunchLock' ./pkg/agentclient
      - name: Windows launch lock static checks
        if: runner.os == 'Windows'
        working-directory: source/server
        run: go vet ./pkg/agentclient
      - name: Race tests
        if: runner.os != 'Windows'
        working-directory: source/server
        run: go test -race -count=1 -timeout=2m ./internal/updatecoord/... ./pkg/update
      - name: Static checks
        working-directory: source/server
        run: go vet ./internal/updatecoord/...
      - name: Work admission and asynchronous lifetime fixtures
        working-directory: source/server
        run: go test -count=1 -timeout=2m -run 'TestUpdateAdmission|TestObserver|TestDownloadWork|TestUpdateWorker|TestUpdateCompaction' ./internal/server ./internal/localruntime ./internal/worker ./internal/compactiongen
      - name: Work admission race checks
        if: runner.os != 'Windows'
        working-directory: source/server
        run: go test -race -count=1 -timeout=2m -run 'TestUpdateAdmission|TestObserver|TestDownloadWork|TestUpdateWorker|TestUpdateCompaction' ./internal/server ./internal/localruntime ./internal/worker ./internal/compactiongen
      - name: Persistence service integration fixtures
        working-directory: source/server
        run: go test -count=1 -timeout=2m ./internal/hostsvc/persistence
      - name: TUF and shared-site fixtures
        working-directory: efforts/cross-platform-updates/tuf-proof
        run: go test -count=1 -timeout=2m ./...
