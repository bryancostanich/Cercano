  string id = 1;
  string conversation_id = 2;
  string role = 3;              // "user" | "assistant" | "system"
  string content = 4;
  int32  tokens_in = 5;
  int32  tokens_out = 6;
  int32  latency_ms = 7;
  int64  created_at = 8;
  // Ordered block array (JSON) for tool-calling turns. When present, this
  // is the lossless representation; `content` remains a flat human-readable
  // fallback for older clients and quick previews.
  string content_json = 9;
}

message ListConversationsRequest {
  string project_dir = 1;       // empty matches all
