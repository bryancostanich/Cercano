name: Release macOS (Apple Silicon)

# Signed, notarized Apple Silicon release.
#
# Deliberately manual: there is no push, tag or pull_request trigger, so
# untrusted code can never reach the signing credentials. An operator starts
# each run explicitly, and publication requires a second explicit opt-in.
#
# Signing and notarization secrets live in the protected `release` environment.
# Configure that environment with required reviewers so a run cannot reach
# Apple credentials without human approval. See docs/macos-release-build.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to build, without a leading v (e.g. 1.2.3)"
        required: true
        type: string
      publish:
        description: "Publish to GitHub Releases. Leave unchecked for a rehearsal."
        required: true
        default: false
        type: boolean

# Least privilege by default; the publish job raises this for itself alone.
permissions:
  contents: read

concurrency:
  # Never let two runs build or publish the same version at once.
  group: release-macos-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, notarize and verify
    runs-on: macos-14  # Apple Silicon
    environment: release
    timeout-minutes: 60
    outputs:
      archive: ${{ steps.build.outputs.archive }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build script requires the version tag to exist

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum

      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::Version must be stable X.Y.Z without a leading v: $VERSION"; exit 1; }
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/v$VERSION^{commit}")" \
            || { echo "::error::No commit tag v$VERSION in this repository."; exit 1; }
          [[ "$TAG_COMMIT" == "$(git rev-parse --verify 'HEAD^{commit}')" ]] \
            || { echo "::error::Selected workflow ref does not match v$VERSION; refusing to label different source as this release."; exit 1; }

      - name: Run release test gate
        run: |
          set -euo pipefail
          ( cd source/server && go test ./internal/brewrestart/... ./pkg/agentclient/... ./cmd/cercano/... )
          python3 scripts/test-macos-release-build.py
          python3 scripts/test-macos-release-verify.py
          ( cd release/homebrew && python3 -m unittest test_render_formula )

      # The keychain is created here and destroyed unconditionally below, so a
      # failed run never leaves signing material on the runner.
      - name: Import signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE_P12" && -n "$CERTIFICATE_PASSWORD" ]] \
            || { echo "::error::Signing secrets are not configured in the release environment."; exit 1; }
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          KEYCHAIN_PATH="$RUNNER_TEMP/cercano-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          # Resolve the identity from the keychain rather than trusting a
          # configured string, and fail if it is absent or ambiguous.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application:' || true)"
          COUNT="$(printf '%s' "$IDENTITIES" | grep -c . || true)"
          [[ "$COUNT" == 1 ]] \
            || { echo "::error::Expected exactly one Developer ID Application identity, found $COUNT."; exit 1; }
          FINGERPRINT="$(printf '%s' "$IDENTITIES" | awk '{print $2}')"
          echo "::add-mask::$FINGERPRINT"
          echo "CERCANO_CODESIGN_ID=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "CERCANO_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and sign release archive
        id: build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-macos-release.sh "$VERSION" dist
          ARCHIVE="dist/cercano-$VERSION-darwin-arm64.tar.gz"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Notarize
        env:
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$NOTARY_ISSUER_ID" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_PRIVATE_KEY" ]] \
            || { echo "::error::Notarization secrets are not configured in the release environment."; exit 1; }
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          umask 077
          printf '%s' "$NOTARY_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          # Store credentials in the same temporary keychain so cleanup removes them.
          xcrun notarytool store-credentials cercano-notary \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH" >/dev/null
          rm -f "$KEY_PATH"
          # Stage the exact signed binaries that were archived.
          STAGE="$RUNNER_TEMP/notarize-stage"
          mkdir -p "$STAGE"
          tar -xzf "dist/cercano-$VERSION-darwin-arm64.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/cercano-$VERSION-darwin-arm64/bin/cercano" \
             "$RUNNER_TEMP/cercano-$VERSION-darwin-arm64/bin/cercano-cli" "$STAGE/"
          python3 scripts/notarize-macos-local.py "$STAGE" "$RUNNER_TEMP/notarization" \
            --keychain-profile cercano-notary --keychain "$KEYCHAIN_PATH"

      - name: Verify finished archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Online Gatekeeper assessment: notarization is confirmed against
          # Apple's records, not assumed from a successful submission.
          python3 scripts/verify-macos-release.py "${{ steps.build.outputs.archive }}" \
            --version "$VERSION" \
            --sha256 "${{ steps.build.outputs.sha256 }}" \
            --notarization-evidence "$RUNNER_TEMP/notarization"

      - name: Render Homebrew formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 release/homebrew/render_formula.py \
            --version "$VERSION" \
            --archive "${{ steps.build.outputs.archive }}" \
            --sha256 "${{ steps.build.outputs.sha256 }}" \
            --output dist/cercano.rb
          echo "Formula rendered for review. Tap promotion is a separate, authorized step."

      - name: Destroy signing keychain
        if: always()
        run: |
          set -uo pipefail
          # Runs even on failure or cancellation so credentials never persist.
          security delete-keychain "$RUNNER_TEMP/cercano-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Upload artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: cercano-${{ inputs.version }}-darwin-arm64
          path: |
            dist/cercano-${{ inputs.version }}-darwin-arm64.tar.gz
            dist/cercano-${{ inputs.version }}-darwin-arm64.tar.gz.sha256
            dist/cercano.rb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Releases
    needs: build
    # Rehearsals stop at reviewable artifacts; publication is a separate opt-in.
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write  # raised only for this job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cercano-${{ inputs.version }}-darwin-arm64
          path: dist

      - name: Refuse to replace an existing published artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ASSET="cercano-$VERSION-darwin-arm64.tar.gz"
          if gh release view "v$VERSION" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "::error::$ASSET is already published on v$VERSION. Publish a new version instead of replacing it."
            exit 1
          fi
          # Confirm the downloaded artifact matches the digest the build recorded.
          echo "${{ needs.build.outputs.sha256 }}  dist/$ASSET" | shasum -a 256 -c -

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/cercano-${{ inputs.version }}-darwin-arm64.tar.gz
            dist/cercano-${{ inputs.version }}-darwin-arm64.tar.gz.sha256
