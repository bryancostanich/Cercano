// AttachConversationRequest names the conversation to observe (see the
// AttachConversation RPC). Declared at file end to keep the generated message
// ordering — and thus the regen diff — minimal.
message AttachConversationRequest {
  string conversation_id = 1;
}

// ============================================================
// Worker service — Phase 5 worker-process turn execution
//
// The worker process is the gRPC SERVER; the host is the gRPC CLIENT.
// The host spawns the worker, dials it, opens a RunTurn stream, sends
// StartTurn, then exchanges events/permissions/persist messages until
// TurnDone or TurnError arrives.
// ============================================================

service Worker {
  // RunTurn executes one conversation turn in the worker process.
  // Host sends HostToWorker (StartTurn, then PermissionResponse / Cancel as
  // needed); worker sends WorkerToHost (WorkerEvent, PermissionRequest,
  // PersistTurn, TurnDone, TurnError).
  rpc RunTurn (stream HostToWorker) returns (stream WorkerToHost) {}
}

// HostToWorker is the host→worker envelope.
message HostToWorker {
  oneof msg {
    StartTurn          start         = 1;
    PermissionResponse perm_response = 2;
    Cancel             cancel        = 3;
    CredentialResponse cred_response = 4;
    OpenInferenceEvent open_event    = 5;
  }
}

// WorkerToHost is the worker→host envelope.
message WorkerToHost {
  oneof msg {
    WorkerEvent       event        = 1;
    PermissionRequest perm_request = 2;
    PersistTurn       persist      = 3;
    TurnDone          done         = 4;
    TurnError         error        = 5;
    CredentialRequest cred_request = 6;
    EnsureSubagentConversation ensure_subagent = 7;
    OpenInferenceRequest open_request = 8;
  }
}

// StartTurn carries everything the worker needs to execute one turn.
// ConfigSnapshot contains the resolved API credential so the worker never
// touches the keychain.
message StartTurn {
  string              conversation_id  = 1;
  string              input            = 2;
  repeated InlineImage images          = 3; // reuse existing InlineImage
  string              work_dir         = 4;
  uint64              gen              = 5; // turn generation (host persist fence)
  ConfigSnapshot      config           = 6;
  repeated LLMMessage history          = 7;
  string              project_context  = 8;
  string              permission_mode  = 9; // host's mode: "strict"|"permissive"|"bypass" — worker gating MUST match the host, never default
}

// LLMMessage is the wire form of llm.Message. Serialization uses the same
// BlocksJSON encoding the persistence layer uses (json.Marshal(m.Blocks)),
// so round-trip fidelity is identical to what the DB already guarantees.
// content is the concatenated text (same as the persistence Content column).
message LLMMessage {
  string role        = 1;
  bytes  blocks_json = 2; // json.Marshal([]llm.Block) — lossless for all block kinds
  string content     = 3; // concatenated text; informational, not used on unmarshal
}

// WorkerEvent mirrors runner.Event. The host maps it back to runner.Event via
// the inverse of sendRunnerEvent. All fields are flat (no sub-messages) to
// keep the mapping trivial.
message WorkerEvent {
  // kind identifies which runner.EventKind this is.
  WorkerEventKind kind = 1;

  // Text: EventToken delta; EventProgress message.
  string text     = 2;

  // Route: EventRouteSelected.
  string model    = 3;
  bool   is_cloud = 4;

  // Tool lifecycle: EventToolUse*/EventToolExec*.
  string tool_use_id   = 5;
  string tool_name     = 6;
  string args_summary  = 7;
  string detail        = 8;
  string summary       = 9;
  int32  start_line    = 10;
  bool   is_error      = 11;

  // Watchdog: EventWatchdog.
  string watchdog_kind = 12;
  string thread        = 13;

  // EventDone — inline result fields (avoids a nested message).
  string final_text    = 14;
  int64  input_tokens  = 15;
  int64  output_tokens = 16;

  // EventDone / EventRouteSelected — notice (e.g. fallback note).
  string notice        = 17;

  // EventSubAgent — child-agent lifecycle/transcript payload.
  string sub_agent_id        = 18;
  string sub_agent_parent_id = 19;
  string sub_agent_title     = 20;
  string sub_agent_kind      = 21;
  repeated string granted_tools = 22;
  repeated string ignored_tools = 23;
}

// WorkerEventKind mirrors runner.EventKind.
enum WorkerEventKind {
  WORKER_EVENT_KIND_UNSPECIFIED    = 0;
  WORKER_EVENT_KIND_ROUTE_SELECTED = 1;
  WORKER_EVENT_KIND_TOKEN          = 2;
  WORKER_EVENT_KIND_PROGRESS       = 3;
  WORKER_EVENT_KIND_TOOL_USE_START = 4;
  WORKER_EVENT_KIND_TOOL_USE_STOP  = 5;
  WORKER_EVENT_KIND_TOOL_EXEC_START    = 6;
  WORKER_EVENT_KIND_TOOL_EXEC_COMPLETE = 7;
  WORKER_EVENT_KIND_WATCHDOG       = 8;
  WORKER_EVENT_KIND_DONE           = 9;
  WORKER_EVENT_KIND_SUBAGENT       = 10;
}

// PermissionRequest asks the host to gate a W/X tool call.
// id correlates each request with its PermissionResponse.
message PermissionRequest {
  uint64 id          = 1;
  string tool_use_id = 2;
  string name        = 3;
  string args_json   = 4;
  string tier        = 5;
  bool   destructive = 6;
}

// PermissionResponse carries the host's allow/deny decision.
message PermissionResponse {
  uint64 id      = 1;
  bool   allow   = 2;
  string error   = 3;
  string message = 4; // "chat about this" redirect carried on a denial
}

// PersistTurn asks the host to persist one turn message.
message PersistTurn {
  LLMMessage message         = 1;
  uint64     gen             = 2; // generation, for the host's persist fence
  string     conversation_id = 3; // sub-agent turns target their own sub-conversation (empty = main turn)
}

// EnsureSubagentConversation asks the host to idempotently create the sub-agent
// conversation row for a worker-side dispatch. Best-effort/fire-and-forget: the
// worker still runs and tabs the sub-agent even if the host store write fails.
message EnsureSubagentConversation {
  string          id            = 1;
  string          parent_id     = 2;
  string          project_dir   = 3;
  string          model         = 4;
  repeated string granted_tools = 5;
  uint64          gen           = 6;
}

// TurnDone signals successful turn completion.
message TurnDone {
  string final_text    = 1;
  string model         = 2;
  bool   is_cloud      = 3;
  int64  input_tokens  = 4;
  int64  output_tokens = 5;
  string notice        = 6;
}

// TurnError signals a failed turn.
message TurnError {
  string message = 1;
}

// Cancel asks the worker to abort the current turn.
message Cancel {}

// ConfigSnapshot carries the config fields the worker needs to build its
// execution Deps (providers.Resolver + runner.Core + tools). The host
// resolves the API key from the keychain and puts it in resolved_credential
// so the worker never touches the keychain.
//
// Field selection: everything providers.Resolver.Main() / runner.Core /
// agenttools reads from config at turn time, plus the full Watchdog block
// (the watchdog supervisor reads it live).
message ConfigSnapshot {
  // Locus mode (cloud_only|cloud_primary|open_primary|open_only).
  string locus_mode = 1;

  // Active cloud profile — the worker uses these to construct the cloud provider.
  string active_cloud_profile = 2;
  string cloud_flavor         = 3;  // messages|chat_completions|responses|bedrock
  string cloud_backend        = 4;  // openai|gemini|groq|… (chat_completions only)
  string cloud_route          = 5;  // direct|meridian (default=direct)
  string cloud_base_url       = 6;
  string cloud_model          = 7;
  string cloud_region         = 8;  // bedrock: AWS region
  string cloud_aws_profile    = 9;  // bedrock: ~/.aws named profile

  // Backup cloud profile name (empty = no fallback).
  string backup_cloud_profile = 10;

  // Resolved API credential — host puts keychain value here.
  string resolved_credential  = 11;

  // Open-weight (local) runtime + model.
  string ollama_url    = 12;
  string open_runtime  = 13; // "ollama" | "llama_server"

  // Model tiers — worker needs these to resolve tier→model at turn time.
  string tier_most_capable_open   = 14;
  string tier_most_capable_cloud  = 15;
  string tier_everyday_open       = 16;
  string tier_everyday_cloud      = 17;
  string tier_fast_light_open     = 18;
  string tier_fast_light_cloud    = 19;
  string tier_fast_light_text_open  = 20;
  string tier_fast_light_text_cloud = 21;
  string tier_embedding_open      = 22;
  string tier_embedding_cloud     = 23;
  string default_provider         = 24; // "cloud" | "open"

  // Compaction — runner reads these for context assembly.
  bool   compaction_enabled               = 25;
  int32  compaction_activation_floor_tokens = 26;
  int32  compaction_segment_tokens        = 27;
  int32  compaction_verbatim_recent       = 28;
  double compaction_hard_override_pct     = 29;
  bool   elide_tool_results               = 30;
  bool   lossy_tool_elision               = 31;

  // Watchdog — supervisor reads these live during the turn.
  bool     watchdog_enabled        = 32;
  string   watchdog_mode           = 33;
  repeated string watchdog_checks  = 34;
  string   watchdog_model          = 35;
  int32    watchdog_escalate_after = 36;
  bool     watchdog_echo           = 37;

  // Backup cloud profile fields — mirror the active-profile fields (3-9) so the
  // worker can build the backup provider and wrap active+backup in a fallback
  // composite, matching in-process behavior. Populated only when
  // backup_cloud_profile (10) is set. The backup's credential is fetched via the
  // same stream credential proxy, keyed by backup_cloud_profile.
  string backup_flavor      = 38; // messages|chat_completions|responses|bedrock
  string backup_backend     = 39; // openai|gemini|groq|… (chat_completions only)
  string backup_route       = 40; // direct|meridian (default=direct)
  string backup_base_url    = 41;
  string backup_model       = 42;
  string backup_region      = 43; // bedrock: AWS region
  string backup_aws_profile = 44; // bedrock: ~/.aws named profile

  int32 tool_loop_max_iterations = 45;
  string model_profiles_json     = 46; // config.ModelProfiles as JSON (nested; not mirrored in proto)
}

// CredentialRequest asks the host to resolve/refresh the provider credential
// for a cloud profile. The worker holds no durable credential; it asks on
// demand (and re-asks on mid-turn expiry). Correlated by id like permissions.
message CredentialRequest {
  uint64 id           = 1;
  string profile_name = 2; // active cloud profile the worker is building a provider for
}

// CredentialResponse carries the host-resolved token/key (or an error).
message CredentialResponse {
  uint64 id      = 1;
  string token   = 2; // API key or fresh access token, per the profile's auth flavor
  string error   = 3;
  string account = 4; // ChatGPT account ID (non-empty for subscription route; empty for static-key routes)
}

// OpenInferenceRequest asks the host to run an open-model chat on the worker's
// behalf. The host owns the llama-server runtime manager; the worker has no
// local open provider, so it proxies inference over the RunTurn stream (mirrors
// CredentialRequest). Always streamed — the worker's non-streaming Chat
// accumulates the events locally.
message OpenInferenceRequest {
  uint64         id      = 1;
  LLMChatRequest request = 2;
}

// LLMChatRequest mirrors llm.ChatRequest for the open-inference proxy.
message LLMChatRequest {
  string              model            = 1;
  string              system           = 2;
  repeated LLMMessage messages         = 3;
  repeated LLMTool    tools            = 4;
  string              tool_choice_type = 5; // "", "auto", "any", "tool", "none"
  string              tool_choice_name = 6; // set when tool_choice_type == "tool"
  int32               max_tokens       = 7;
  // optional so pointer semantics survive the wire: absent = provider
  // default, present 0 = greedy decoding (the summarizer's requirement).
  optional double     temperature      = 8;
}

// LLMTool mirrors llm.Tool (the model-facing fields; Permission is agent-side).
message LLMTool {
  string name        = 1;
  string description = 2;
  bytes  schema      = 3; // JSON schema (llm.Tool.Schema)
}

// OpenInferenceEvent streams one open-inference result back to the worker,
// routed by request id. Terminates with done=true or a non-empty error.
message OpenInferenceEvent {
  uint64 id = 1;
  oneof kind {
    LLMStreamEvent event = 2;
    string         error = 3;
    bool           done  = 4;
  }
}

// LLMStreamEvent mirrors llm.StreamEvent field-for-field.
message LLMStreamEvent {
  string type           = 1; // llm.StreamEventType serialized (e.g. "text_delta")
  string text_delta     = 2;
  string tool_use_id    = 3;
  string tool_name      = 4;
  bytes  tool_input_raw = 5;
  string reasoning_id   = 6;
  string reasoning_data = 7;
  string stop_reason    = 8;
  int64  input_tokens   = 9;
  int64  output_tokens  = 10;
  string err_text       = 11;
}
