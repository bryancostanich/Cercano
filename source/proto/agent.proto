message RenameConversationResponse { bool ok = 1; }

message GetConversationRequest { string conversation_id = 1; }

// ListSubAgents surface: the CLI passes the parent (main) conversation id and
// gets back the persisted sub-agent conversations spawned under it, in spawn
// order. Each carries the granted tool set so a restored tab renders the same
// "Tools: …" line it showed live; the transcript itself is fetched per child
// via ResumeConversation.
message ListSubAgentsRequest  { string parent_id = 1; }
message ListSubAgentsResponse { repeated SubAgentConversation subagents = 1; }

// DismissSubAgent surface: the CLI passes the sub-agent conversation id to hide
// its tab on future resumes. Response is empty (best-effort).
message DismissSubAgentRequest  { string conversation_id = 1; }
message DismissSubAgentResponse {}

// SubAgentConversation is one persisted sub-agent loop's identity: enough for
// the CLI to recreate its tab (title + granted tools) and then fetch the
// transcript by id via ResumeConversation. parent_id links nested sub-agents
// (a dispatch that itself dispatched) so the CLI can recompute "sub 1.1"-style
// labels from the parent/child relationships.
message SubAgentConversation {
  string id = 1;
  string parent_id = 2;
  string title = 3;
  repeated string granted_tools = 4;
}

// Context-window usage for a conversation. Used is the cumulative tokens
// counted for this conversation; max is the conventional context-window
// size for the active model. Computed via tokenizer estimates (and upstream
// counts when available); not exact for non-OpenAI families.
message GetContextUsageRequest  { string conversation_id = 1; }
message GetContextUsageResponse {
  int32  tokens_used = 1; // the SENT (compacted) size
  int32  model_max   = 2;
  double percent     = 3;
  int32  raw_tokens  = 4; // the uncompacted size
  bool   compacting  = 5; // a compaction pass is currently running
}

message SuggestNextPromptRequest  { string conversation_id = 1; }
message SuggestNextPromptResponse { string suggestion = 1; }

message GetCompactionStateRequest  { string conversation_id = 1; }
message GetCompactionStateResponse {
  int64  frozen_through       = 1;
  int32  frozen_turns         = 2;
  int32  live_turns           = 3;
  int32  compacted_segments   = 4;
  int32  raw_tokens           = 5;
  int32  sent_tokens          = 6;
  string consolidated_summary = 7;
  bool   compacting           = 8;
}
message ElideContextRequest  { string conversation_id = 1; }
message ElideContextResponse {
  int32 pre_tokens  = 1; // sent-view tokens before this call
  int32 post_tokens = 2; // sent-view tokens after
