  string ollama_url = 1;
  string open_model = 2;
  string embedding_model = 3;
  string cloud_provider = 4;
  string cloud_model = 5;
  string cloud_base_url = 6;
  bool   cloud_api_key_set = 7;
  // Last observed cloud state: "ok", "absent", "error". Reflects whether the
  // most recent turn succeeded; useful for surfacing in the CLI status bar.
  string cloud_state = 8;
  string port = 9;
  string open_runtime = 10;
  string locus_mode = 11;
  bool watchdog_enabled = 12;
  bool watchdog_echo = 13;
  // Compaction — Development Tools. Reported as plain bools since the reader
  // always knows the current value.
  bool elide_tool_results = 14;
  bool lossy_tool_elision = 15;
  // Retention (Development Tools). Integers reported directly; keep_forever
  // gates any actual aging.
  int32 raw_retention_days       = 16;
  int32 compacted_retention_days = 17;
  bool  keep_forever             = 18;
  // Compaction master switch state.
  bool  compaction_enabled       = 19;
  // Tool-elision-only mode state (compaction passes elide instead of summarize).
  bool  tool_elision_only        = 29;
  // Watchdog (Development Tools) — current values.
  string watchdog_mode = 20;
  string watchdog_checks = 21;          // comma-joined
  string watchdog_escalate_after = 22;  // int as string
  // Model taxonomy — current tier slots, keyed "<tier>.<provider>" (only
  // non-empty slots are present), plus the default provider side.
  map<string, string> model_tiers = 23;
  string models_default_provider = 24;
  // Tool loop — max LLM round-trips per turn. -1 means unlimited.
  int32 tool_loop_max_iterations = 25;
  // mistral.rs runtime settings — current values.
  string mistralrs_isq = 26;
  string mistralrs_paged_attn = 27;
  string mistralrs_pa_memory_fraction = 28;
  // Agent lifecycle.
  bool agent_shutdown_on_last_client = 30;
}

message ListSkillsRequest {}

// A single skill in the catalog.
message SkillInfo {
  string name = 1;          // Skill name (matches directory name)
  string description = 2;   // What the skill does and when to use it
}

// Response containing available skills.
message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

// Request to get a specific skill's full definition.
message GetSkillRequest {
  string name = 1; // Skill name to retrieve
}

// Response containing the full skill definition.
message GetSkillResponse {
  string name = 1;        // Skill name
  string content = 2;     // Full SKILL.md file content
}

// Permission-mode RPCs let the CLI's slash commands (/strict, /permissive,
// /bypass) flip how the agent gates W/X tools, and let the status bar read
// the current mode at startup.
message SetPermissionModeRequest  { string mode = 1; }     // "strict" | "permissive" | "bypass"
message SetPermissionModeResponse { bool ok = 1; string error = 2; }

message GetPermissionModeRequest  {}
message GetPermissionModeResponse { string mode = 1; }

// SubscribeEvents transport. The request is empty today; a client_id may be
// added later for targeted pushes. ClientEvent is a oneof so new server->client
// event types can be added without a new RPC.
message SubscribeEventsRequest {}

message ClientEvent {
  oneof event {
    PermissionModeChanged permission_mode_changed = 1;
    ConfigChanged config_changed = 2;
    OpenRuntimeStatusChanged open_runtime_status_changed = 4;
  }
}

// PermissionModeChanged carries the new active mode. Clients update their
// status bar from this — no fetch, no poll.
message PermissionModeChanged { string mode = 1; }

// ConfigChanged carries one config field that just changed (RPC or file
// watcher). Field is a top-level config key as it appears in UpdateConfigRequest
// (e.g. "cloud_model", "ollama_url"). Value is the new value as a string;
// secrets are reported as a presence marker, never the raw value. When several
// fields change together, one event is emitted per field.
message ConfigChanged {
  string field = 1;
  string value = 2;
}

// OpenRuntimeStatus is the live state of the active open-weight inference runtime
// (ollama or llama_server). Emitted after a runtime swap (config edit or
// UpdateConfig RPC) — clients render a status chip and drive the recovery
// modal from this.
//
// runtime values: "ollama" | "llama_server".
// missing values (when ok=false): "binary" | "model". Empty when ok=true.
//   "binary" — the runtime executable is not on PATH / not at Binary path.
//              CLI should offer the install flow (InstallOpenRuntime RPC).
//   "model"  — the runtime is available but no usable model is configured.
//              CLI should surface a model-picker / download flow.
message OpenRuntimeStatus {
  bool ok = 1;
  string runtime = 2;
  string missing = 3;
  string message = 4;
  string suggested_command = 5;
  string binary_path = 6;
  string default_model = 7;
  // downloading is true when the runtime is not yet ready ONLY because its
  // default model is actively downloading (DownloadState=downloading). It is a
  // distinct chip state from "missing": the CLI renders "o: downloading" and
  // does NOT nag the user to act (no F1). When true, ok=false and missing="".
  bool downloading = 8;
}

// OpenRuntimeStatusChanged is broadcast whenever the open runtime state
// changes (post-swap detection, install completes, etc.). Clients update
// their status chip + modal from this — no fetch, no poll.
message OpenRuntimeStatusChanged { OpenRuntimeStatus status = 1; }

// GetOpenRuntimeStatus is the pull-side counterpart to
// OpenRuntimeStatusChanged. Empty request — the server always returns the
// snapshot for the currently-selected open runtime.
message GetOpenRuntimeStatusRequest {
  // Runtime to detect against ("ollama" | "llama_server"). Empty falls
  // back to the currently-selected runtime — used by the CLI startup
  // fetch to render the chip. The settings-page gate uses this explicit
  // form to probe a runtime BEFORE switching to it, so a user can be
  // asked to install BEFORE the config is silently accepted.
  string runtime = 1;
}
message GetOpenRuntimeStatusResponse { OpenRuntimeStatus status = 1; }

// InstallOpenRuntimeRequest asks the server to run the platform install
// command for an open-weight runtime and stream its output back.
//
// runtime values today: "llama_server" — future runtimes can be added
// without breaking the wire format.
message InstallOpenRuntimeRequest {
  string runtime = 1;
}

// InstallProgress is one frame in an install output stream. Frames with
// done=false carry stdout/stderr lines from the install subprocess as they
// arrive. The stream terminates with a single frame carrying done=true;
// ok=true means the subprocess exited cleanly and the runtime should be
// usable after a fresh detection, ok=false means install failed and the
// error field explains why.
message InstallProgress {
  string line = 1;
  bool done = 2;
  bool ok = 3;
  string error = 4;
}

message RegenerateContextRequest {
  string conversation_id = 1;
  // incremental=false (default): full rebuild — clear the derived compaction
  // state first, then re-run compaction from the first turn.
  // incremental=true: keep existing state and digest only the current
  // backlog from FrozenThrough forward (the /compact command).
  bool incremental = 2;
  // clear_only=true: drop the derived compaction state and stop — no
  // re-summarization. The next send-view is the full raw turn history (the
  // /clear-compacted-context command; recovery when the compacted layer is
  // bad). Mutually exclusive with incremental.
  bool clear_only = 3;
}

message RegenerateContextProgress {
  string line = 1;  // human-readable progress ("pass 2: 41200 -> 12400 tokens")
  bool done = 2;
  bool ok = 3;
  string error = 4;
  // Set on the final (done) frame: send-view token counts before the rebuild
  // and after it, so clients can update a context meter immediately.
  int32 pre_tokens = 5;
  int32 post_tokens = 6;
}

// Allow/Deny pair the asynchronous PermissionRequired stream event with a
// client reply. tool_use_id is the same id the event carried.
message AllowToolCallRequest  { string tool_use_id = 1; bool persist = 2; string conversation_id = 3; }
message AllowToolCallResponse { bool ok = 1; }

message DenyToolCallRequest  { string tool_use_id = 1; string conversation_id = 2; string message = 3; }
message DenyToolCallResponse { bool ok = 1; }

// Provider capability snapshot — clients hide tool-call UI when the active
// provider can't drive native tool use.
message GetProviderCapabilitiesRequest {}
message GetProviderCapabilitiesResponse {
  bool supports_tools = 1;
  bool supports_parallel_tools = 2;
  bool supports_caching = 3;
  bool supports_vision = 4;
  int32 max_tools_per_call = 5;
}

// Tool-call event blocks for streaming responses. ToolUseStart/Stop bracket
// the model emitting a tool call; ToolExecStart/Complete bracket the agent
// executing it; PermissionRequired pauses the stream until the client
// answers via AllowToolCall or DenyToolCall.
message ToolUseStart   { string tool_use_id = 1; string tool_name = 2; }
message ToolUseStop    { string tool_use_id = 1; string args_summary = 2; }
message ToolExecStart  { string tool_use_id = 1; }
message ToolExecComplete {
  string tool_use_id = 1;
  string summary = 2;
  bool is_error = 3;
  // detail is a clean, timing-free, content-free outcome token ("480 lines",
  // "12 matches", "+3 −1") rendered by clients next to the status glyph.
  string detail = 4;
  // start_line is the 1-based line in the target file where a file edit/write
  // began (edit_file: first line of the replaced span in the pre-edit file;
  // write_file: 1). Clients number the args diff with it. 0 = not applicable.
  int32 start_line = 5;
}
message PermissionRequired {
  string tool_use_id = 1;
  string tool_name = 2;
  string args_json = 3;
  string tier = 4;       // "W" | "X"
  bool   destructive = 5; // display-only ⚠ hint (MCP destructiveHint); never affects gating
}

