name: Enterprise client

on:
  pull_request:
    paths:
      - 'source/server/internal/enterprise/**'
      - 'source/server/internal/modelpolicy/**'
      - 'source/server/internal/llm/**'
      - 'source/server/internal/engine/**'
      - 'source/server/internal/localruntime/**'
      - 'source/server/internal/worker/**'
      - 'source/server/internal/inference/resilience/**'
      - 'source/proto/**'
      - 'source/server/pkg/proto/**'
      - 'source/server/cmd/cercano/**'
      - 'source/server/go.mod'
      - 'source/server/go.sum'
      - '.github/workflows/enterprise-client.yml'
  push:
    paths:
      - 'source/server/internal/enterprise/**'
      - 'source/server/internal/modelpolicy/**'
      - 'source/server/internal/llm/**'
      - 'source/server/internal/engine/**'
      - 'source/server/internal/localruntime/**'
      - 'source/server/internal/worker/**'
      - 'source/server/internal/inference/resilience/**'
      - 'source/proto/**'
      - 'source/server/pkg/proto/**'
      - 'source/server/cmd/cercano/**'
      - 'source/server/go.mod'
      - 'source/server/go.sum'
      - '.github/workflows/enterprise-client.yml'

permissions:
  contents: read

jobs:
  connection-and-enforcement:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum
      - run: go test -race ./internal/enterprise ./internal/modelpolicy ./internal/llm/... ./internal/engine/... ./internal/localruntime/... ./internal/worker ./internal/inference/resilience ./cmd/cercano
      - run: go vet ./internal/enterprise ./internal/modelpolicy ./internal/llm/... ./internal/engine/... ./internal/localruntime/... ./internal/worker ./cmd/cercano
      - run: go build ./cmd/cercano
