name: Enterprise contract

on:
  pull_request:
    paths:
      - 'source/enterpriseapi/**'
      - '.github/workflows/enterprise-contract.yml'
  push:
    paths:
      - 'source/enterpriseapi/**'
      - '.github/workflows/enterprise-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/enterpriseapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/enterpriseapi/go.mod
          cache-dependency-path: source/enterpriseapi/go.sum
      - run: go test -race ./...
      - run: go vet ./...
