  bool   found     = 1; // the tool_use block was located
  string tool_name = 2;
  string args_json = 3; // full tool_use input JSON
  string result    = 4; // full tool_result body (empty if not yet recorded)
  bool   is_error  = 5;
  int32  start_line = 6; // 1-based first line of an edit/write (0 = n/a)
}
message ContextTurn {
  string role       = 1; // "user" | "assistant" | "system"
  string kind       = 2; // "text" | "tool_use" | "tool_result"
  string preview    = 3; // flattened, truncated, display-ready
  int32  est_tokens = 4; // contextmeter tokenizer estimate
  string id         = 5; // persistent turn ID (UUID)
  string body       = 6; // un-flattened content (newlines preserved), capped at 4 KB
  bool   truncated  = 7; // true if body was capped
  // Tool metadata from the turn's FIRST tool block, so the /c viewer can use
  // the same rich tool renderers as the main chat (syntax highlight, diffs).
  string tool_name    = 8;  // tool_use turns: the tool's name
  string tool_use_id  = 9;  // tool_use turns: the call's correlation id
  string tool_args    = 10; // tool_use turns: input JSON, capped at 4 KB
  string tool_use_ref = 11; // tool_result turns: originating call's id
  int32  tool_start_line = 12; // tool_result turns: 1-based first line of an edit/write (0 = n/a)
}

message ProposeContextEditRequest  { string conversation_id = 1; string instruction = 2; }
