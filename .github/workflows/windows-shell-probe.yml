name: Windows shell diagnostic
on:
  push:
    branches: [debug/windows-shell-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare native Python shell launch paths
        shell: bash
        run: python scripts/probe-windows-shell.py
