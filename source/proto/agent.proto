syntax = "proto3";

package agent;

option go_package = "cercano/source/server/pkg/proto";

// The Agent service definition.
service Agent {
  // ProcessRequest handles AI requests (Unary).
  rpc ProcessRequest (ProcessRequestRequest) returns (ProcessRequestResponse) {}

  // StreamProcessRequest handles AI requests with progress updates (Streaming).
  rpc StreamProcessRequest (ProcessRequestRequest) returns (stream StreamProcessResponse) {}

  // AttachConversation streams the live turn events of a conversation the caller
  // did NOT start — a second surface (e.g. VS Code) watching a conversation the
  // CLI is driving. It replays the in-flight turn's events so far, then streams
  // live, using the same StreamProcessResponse vocabulary as StreamProcessRequest.
  // Observe-only: it does not send input or answer permission prompts.
  rpc AttachConversation (AttachConversationRequest) returns (stream StreamProcessResponse) {}

  // UpdateConfig updates runtime configuration (model, provider) without server restart.
  rpc UpdateConfig (UpdateConfigRequest) returns (UpdateConfigResponse) {}

  // GetConfig returns the current runtime config. API key is reported as a
  // presence bool only — the literal value never leaves the agent.
  rpc GetConfig (GetConfigRequest) returns (GetConfigResponse) {}

  // Persisted-conversation surface: /history picker calls ListConversations;
  // selecting a row calls ResumeConversation; deleting a row (future) calls
  // DeleteConversation. Resume rehydrates the in-memory session store on the
  // agent so the next chat turn sees full prior context.
  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse) {}
  rpc ResumeConversation (ResumeConversationRequest) returns (ResumeConversationResponse) {}
  rpc DeleteConversation (DeleteConversationRequest) returns (DeleteConversationResponse) {}
  rpc RenameConversation (RenameConversationRequest) returns (RenameConversationResponse) {}
  rpc GetConversation (GetConversationRequest) returns (Conversation) {}

  // ListSubAgents returns the persisted sub-agent (dispatch) conversations
  // spawned under a parent conversation, in spawn order. The CLI calls this on
  // resume to reopen each sub-agent chat tab, populated from the persisted
  // transcripts (fetched per child via ResumeConversation).
  rpc ListSubAgents (ListSubAgentsRequest) returns (ListSubAgentsResponse) {}

  // DismissSubAgent marks a persisted sub-agent conversation as dismissed so a
  // resumed CLI does not reopen its tab (the user closed it, or the tab was
  // swept when its turn finished). Best-effort: the child transcript stays in
  // the store, it just no longer surfaces as a tab.
  rpc DismissSubAgent (DismissSubAgentRequest) returns (DismissSubAgentResponse) {}

  // GetContextUsage reports cumulative token usage vs. the active model's
  // context window for a conversation. The CLI status bar polls this after
  // each streamed turn.
  rpc GetContextUsage (GetContextUsageRequest) returns (GetContextUsageResponse) {}

  // GetCompactionState returns the compaction summary + frozen/live split for
  // the /c context viewer.
  rpc GetCompactionState (GetCompactionStateRequest) returns (GetCompactionStateResponse) {}

  // ElideContext stubs every tool-result body in the conversation's context up
  // to now (the /elide-context command). In-memory and send-view only: stored
  // raw turns are untouched and the floor resets on agent restart. Tool
  // results produced after the call stay intact until the next call.
  rpc ElideContext (ElideContextRequest) returns (ElideContextResponse) {}

  // SuggestNextPrompt asks the local co-processor model for one short
  // follow-up the user might type next, given the conversation so far. The
  // CLI renders the result as ghost text in the input widget. Empty response
  // means "no suggestion" — the CLI treats it as no-op.
  rpc SuggestNextPrompt (SuggestNextPromptRequest) returns (SuggestNextPromptResponse) {}

  // GetOpenRuntimeStatus returns the current headless-detection outcome
  // for the selected open runtime. Callers use it once at startup to
  // populate the CLI chip / install modal without waiting for a config
  // change to fire a OpenRuntimeStatusChanged event.
  rpc GetOpenRuntimeStatus (GetOpenRuntimeStatusRequest) returns (GetOpenRuntimeStatusResponse) {}

  // InstallOpenRuntime runs the platform install command for an open-weight
  // inference runtime (today: "llama_server" via `brew install llama.cpp`
  // on macOS) and streams stdout/stderr line-by-line to the caller. The
  // final message carries done=true with ok set to the outcome.
  //
  // The server re-runs detection after a successful install and emits a
  // fresh OpenRuntimeStatusChanged event on the SubscribeEvents stream,
  // so CLIs get the "runtime is now ready" signal through the same channel
  // they used to render the "needs setup" chip.
  rpc InstallOpenRuntime (InstallOpenRuntimeRequest) returns (stream InstallProgress) {}

  // RegenerateContext rebuilds a conversation's derived context from its raw
  // turns: clears the stored compaction state and re-runs compaction to
  // completion, persisting each pass. Raw turns are never modified. Streams
  // human-readable progress; the final frame carries before/after send-view
  // token counts so clients can update their context meter without a
  // follow-up call.
  rpc RegenerateContext (RegenerateContextRequest) returns (stream RegenerateContextProgress) {}

  // ExportContext returns the full uncapped raw history as a JSON []llm.Message.
  rpc ExportContext (ExportContextRequest) returns (ExportContextResponse) {}

  // ExportTrajectory writes a full ATIF-v1.7 Cercano trajectory bundle for a
  // persisted conversation. The server owns persistence reads, ATIF mapping,
  // artifact collection, redaction, validation, and optional zip packaging; the
  // client only collects options and renders progress.
  rpc ExportTrajectory (ExportTrajectoryRequest) returns (stream ExportTrajectoryEvent) {}

  // GetConversationTurns returns display-ready, side-effect-free summaries of a
  // conversation's turns for the /c context viewer. Unlike ResumeConversation
  // it does NOT re-hydrate server session state.
  rpc GetConversationTurns (GetConversationTurnsRequest) returns (GetConversationTurnsResponse) {}

  // GetToolCall returns the full args + result body for a single tool call in
  // a conversation, looked up by tool_use_id. Backs the CLI's lazy
  // expand-on-click of a scrollback tool entry — full args/results are read
  // from content_json on demand rather than streamed on every turn.
  rpc GetToolCall (GetToolCallRequest) returns (GetToolCallResponse) {}

  // ListTools enumerates the agent's registered tools (name, description,
  // permission tier). /tools in the CLI renders this through the Table
  // primitive.
  rpc ListTools (ListToolsRequest) returns (ListToolsResponse) {}

  // InvokeTool executes a registered tool with JSON args and returns its
  // Result. Used by /tool <name> {...args} for direct invocation; the
  // agent's chat path will dispatch tools via this same RPC once the
  // algorithmic-dispatcher lands.
  rpc InvokeTool (InvokeToolRequest) returns (InvokeToolResponse) {}

  // InvokeCapability runs a named agent capability (skill) with JSON-encoded
  // args and returns a JSON-encoded result or error.
  rpc InvokeCapability (InvokeCapabilityRequest) returns (InvokeCapabilityResponse) {}

  // ListModels returns the models available on the active Ollama instance.
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse) {}

  // Runtime dashboard APIs expose managed runtimes, external endpoints, and
  // logs through Cercano rather than having the CLI call providers directly.
  rpc GetRuntimeStatus (GetRuntimeStatusRequest) returns (GetRuntimeStatusResponse) {}
  rpc ListRuntimeModels (ListRuntimeModelsRequest) returns (ListRuntimeModelsResponse) {}
  rpc ListRuntimeEndpoints (ListRuntimeEndpointsRequest) returns (ListRuntimeEndpointsResponse) {}
  rpc StartRuntimeModel (StartRuntimeModelRequest) returns (StartRuntimeModelResponse) {}
  rpc StopRuntimeModel (StopRuntimeModelRequest) returns (StopRuntimeModelResponse) {}
  rpc RestartRuntime (RestartRuntimeRequest) returns (RestartRuntimeResponse) {}
  rpc DownloadRuntimeModel (DownloadRuntimeModelRequest) returns (DownloadRuntimeModelResponse) {}
  rpc CancelRuntimeModelDownload (CancelRuntimeModelDownloadRequest) returns (CancelRuntimeModelDownloadResponse) {}
  rpc DeleteRuntimeModel (DeleteRuntimeModelRequest) returns (DeleteRuntimeModelResponse) {}

  // RefreshOnlineCatalog forces a fresh fetch of the online model catalog
  // (Ollama's public library) — bypasses the 24h TTL. Returns after the
  // fetch completes. Used by the CLI's dashboard "R" refresh key.
  rpc RefreshOnlineCatalog (RefreshOnlineCatalogRequest) returns (RefreshOnlineCatalogResponse) {}
  rpc GetModelRAMEstimate (GetModelRAMEstimateRequest) returns (GetModelRAMEstimateResponse) {}
  rpc StreamRuntimeLogs (StreamRuntimeLogsRequest) returns (stream RuntimeLogEntry) {}

  // ListSkills returns the catalog of available Agent Skills (name + description).
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse) {}

  // GetSkill returns the full SKILL.md content for a specific skill by name.
  rpc GetSkill (GetSkillRequest) returns (GetSkillResponse) {}

  // SetPermissionMode changes the agent's session permission mode.
  rpc SetPermissionMode (SetPermissionModeRequest) returns (SetPermissionModeResponse) {}

  // GetPermissionMode reads the current mode.
  rpc GetPermissionMode (GetPermissionModeRequest) returns (GetPermissionModeResponse) {}

  // SubscribeEvents is a standing server->client stream the client holds open
  // for its whole session. The agent pushes unsolicited state changes here so
  // clients never poll. First event type is PermissionModeChanged (fired when
  // the mode is changed via SetPermissionMode by any client, or when the
  // permissions file is edited out-of-band by a human or a tool).
  rpc SubscribeEvents (SubscribeEventsRequest) returns (stream ClientEvent) {}

  // AllowToolCall + DenyToolCall are how a client replies to a
  // PermissionRequired stream event.
  rpc AllowToolCall (AllowToolCallRequest) returns (AllowToolCallResponse) {}
  rpc DenyToolCall  (DenyToolCallRequest)  returns (DenyToolCallResponse)  {}

  // GetProviderCapabilities reports what the active provider supports.
  rpc GetProviderCapabilities (GetProviderCapabilitiesRequest) returns (GetProviderCapabilitiesResponse) {}

  // ProposeContextEdit runs the picker model over a conversation's turn summaries
  // and returns a validated deletion proposal. Read-only — no turns are deleted.
  rpc ProposeContextEdit (ProposeContextEditRequest) returns (ProposeContextEditResponse) {}

  // DeleteConversationTurns hard-deletes the named turns from a conversation.
  rpc DeleteConversationTurns (DeleteConversationTurnsRequest) returns (DeleteConversationTurnsResponse) {}

  // ---- MCP host ----
  rpc ListMcpServers (ListMcpServersRequest) returns (ListMcpServersResponse) {}
  rpc AddMcpServer (AddMcpServerRequest) returns (AddMcpServerResponse) {}
  rpc RemoveMcpServer (RemoveMcpServerRequest) returns (RemoveMcpServerResponse) {}
  rpc RestartMcpServer (RestartMcpServerRequest) returns (RestartMcpServerResponse) {}

  // ---- Cloud profile management ----
  rpc GetCloudProfiles (GetCloudProfilesRequest) returns (GetCloudProfilesResponse) {}
  // GetCloudProviders returns the known-provider catalog with each configured
  // profile already grouped under its provider (primary first). The agent owns
  // provider knowledge; the CLI renders this view without its own catalog.
  rpc GetCloudProviders (GetCloudProvidersRequest) returns (GetCloudProvidersResponse) {}
  rpc SetActiveCloudProfile (SetActiveCloudProfileRequest) returns (SetActiveCloudProfileResponse) {}
  // SetBackupCloudProfile names the profile that serves requests when the
  // active profile's provider fails (auth/rate-limit/5xx/network). An empty
  // name clears the backup.
  rpc SetBackupCloudProfile (SetBackupCloudProfileRequest) returns (SetBackupCloudProfileResponse) {}
  rpc SetCloudProfileKey (SetCloudProfileKeyRequest) returns (SetCloudProfileKeyResponse) {}
  rpc UpsertCloudProfile (UpsertCloudProfileRequest) returns (UpsertCloudProfileResponse) {}
  rpc RemoveCloudProfile (RemoveCloudProfileRequest) returns (RemoveCloudProfileResponse) {}
  // ListCloudProfileModels fetches the model catalog available to a specific
  // cloud profile's endpoint (e.g. Anthropic /v1/models through Meridian).
  // Used by the settings UI to populate a curated model dropdown instead of
  // asking the user to type an ID.
  rpc ListCloudProfileModels (ListCloudProfileModelsRequest) returns (ListCloudProfileModelsResponse) {}

  // StartChatGPTLogin runs OpenAI's device-authorization sign-in for ChatGPT
  // subscription access. The first stream frame carries user_code +
  // verification_url to display; a terminal frame (done=true) reports the
  // outcome and the created profile.
  rpc StartChatGPTLogin(StartChatGPTLoginRequest) returns (stream StartChatGPTLoginEvent);

  // StartClaudeLogin runs the Claude Max/Pro subscription sign-in: a PKCE
  // authorization-code flow with a loopback redirect. The first frame carries
  // the authorize URL for the client to open; the terminal frame (done=true)
  // reports ok/error. On success the agent stores the token set and creates a
  // messages+subscription cloud profile.
  rpc StartClaudeLogin(StartClaudeLoginRequest) returns (stream StartClaudeLoginEvent);
}

// Incremental token from LLM streaming.
message TokenDelta {
  string content = 1;
}

// The response message for StreamProcessRequest.
message StreamProcessResponse {
  oneof payload {
    ProgressUpdate    progress = 1;
    ProcessRequestResponse final_response = 2;
    TokenDelta        token_delta = 3;
    ToolUseStart      tool_use_start = 4;
    ToolUseStop       tool_use_stop = 5;
    ToolExecStart     tool_exec_start = 6;
    ToolExecComplete  tool_exec_complete = 7;
    PermissionRequired permission_required = 8;
    RouteSelected     route_selected = 9;
    WatchdogEvent     watchdog_event = 10;
    SubAgentEvent     sub_agent_event = 11;
  }
}

// RouteSelected announces which engine is handling the turn, emitted once the
// route is chosen (and again on any mid-turn switch). Lets clients show a live
// "<model> (local|cloud)" badge.
message RouteSelected {
  string model = 1;
  bool is_cloud = 2;
}

// WatchdogEvent is a protocol-supervisor intervention surfaced to the client.
message WatchdogEvent {
  string kind     = 1; // "challenge" | "block" | "echo"
  string protocol = 2; // e.g. "commit-checkpoint" (empty for echo)
  string text     = 3; // the challenge text, or the echo line
  string thread   = 4; // echo only: "watchdog" | "main" (empty otherwise)
}

// Progress update during a long-running task.
message ProgressUpdate {
  string message = 1;
}

// SubAgentEvent carries structured lifecycle and transcript events for a child
// agent. Clients can route these to an ephemeral child tab without scraping
// human-readable progress text.
message SubAgentEvent {
  string id = 1;
  string title = 2;
  string kind = 3; // started|progress|token|tool_use_start|tool_use_stop|tool_exec_start|tool_exec_complete|done|error
  string parent_id = 14;
  repeated string granted_tools = 4;
  repeated string ignored_tools = 5;
  string text = 6;
  string tool_use_id = 7;
  string tool_name = 8;
  string args_summary = 9;
  string summary = 10;
  string detail = 11;
  int32 start_line = 12;
  bool is_error = 13;
}

// The request message for ProcessRequest.
message ProcessRequestRequest {
  string input = 1; // User input or query
  // Field 2 removed (was CloudProviderConfig provider_config)
  string work_dir = 3;  // Optional working directory for agentic tasks
  string file_name = 4; // Optional filename for agentic tasks
  string conversation_id = 5; // Optional conversation ID for multi-turn history
  bool direct_open = 6; // Skip SmartRouter, go directly to the open-weight provider
  string model_override = 7; // Use this model instead of the configured default (temporary, per-request)
  bool coproc = 8; // Route per Locus Mode's co-processor tier (local/cloud)
  repeated InlineImage images = 9; // user-attached images, spliced in at "[image N]" markers in input
}

// InlineImage is one user-attached image. Index matches the "[image <Index>]"
// marker in ProcessRequestRequest.input; data is the raw image bytes.
message InlineImage {
  int32 index = 1;
  bytes data = 2;
  string media_type = 3; // e.g. "image/png"
}

// Runtime configuration update request.
message UpdateConfigRequest {
  string open_model = 1;    // Open-weight model name (Ollama tag or managed runtime model id/path)
  string cloud_provider = 2; // Cloud provider name (e.g., "google", "anthropic")
  string cloud_model = 3;    // Cloud model name (e.g., "gemini-1.5-flash", "claude-3-opus")
  string cloud_api_key = 4;  // API key for the cloud provider
  string ollama_url = 5;     // Ollama endpoint URL (e.g., "http://mac-studio.local:11434")
  // Anthropic-compatible proxy URL (e.g., "http://127.0.0.1:3456" for Meridian).
  // When set, used as the baseURL for the anthropic client; api_key may be empty
  // because the proxy handles auth (Claude Max OAuth in Meridian's case).
  string cloud_base_url = 6;
  string open_runtime = 7;  // Open-weight runtime name: "ollama", "llama_server", or "mistralrs"
  string locus_mode = 8;     // cloud_only|cloud_primary|open_primary|open_only
  string watchdog_enabled = 9;  // "" = unchanged, "true"/"false"
  string watchdog_echo = 10;    // "" = unchanged, "true"/"false"
  // Compaction — Development Tools. String-encoded bool ("" | "true" | "false")
  // to match the sparse-patch convention of the other fields (empty = unchanged).
  string elide_tool_results = 11; // Mechanical superseded-tool-result dedup on assemble.
  string lossy_tool_elision = 12; // Recency-window: keep last N tool_results, stub older.
  // Retention (Development Tools). Strings for the sparse-patch convention;
  // days must parse as non-negative decimal integers.
  string raw_retention_days       = 13;
  string compacted_retention_days = 14;
  string keep_forever             = 15;
  // Compaction master switch. When "true", the summarization pass runs on
  // eligible conversations. "" leaves unchanged.
  string compaction_enabled       = 16;
  // Tool-elision-only mode. When "true" (and compaction is enabled), passes
  // run on the normal triggers but never call the summarizer — they advance
  // the conversation's in-memory elision floor instead (recurring automatic
  // /elide-context). "" leaves unchanged.
  string tool_elision_only        = 27;
  // Watchdog (Development Tools). Sparse-patch convention: "" = unchanged.
  string watchdog_mode = 17;            // "challenge-and-justify"|"strict"
  string watchdog_checks = 18;          // "-" = empty; else comma-joined
  string watchdog_escalate_after = 19;  // positive int
  // llama_server.default_model — the GGUF the managed runtime loads. Distinct
  // from open_model (which is the ollama-flavored local model name) so a
  // GGUF pick never clobbers the user's ollama tag. Applied BEFORE any
  // open_runtime switch in the same request, so a request carrying both
  // resolves an ambiguous-model detection in one round trip.
  string open_default_model = 20;
  // Model taxonomy (sparse-patch): model_tier_key selects the slot —
  // "default_provider", or "<tier>.<provider>" with tier one of
  // most_capable|everyday|fast_light|fast_light_text and provider cloud|open.
  // model_tier_value is the model id; "-" clears the slot. Empty key = unchanged.
  string model_tier_key = 21;
  string model_tier_value = 22;
  // Tool loop — max LLM round-trips per turn. Sparse-patch convention:
  // "" = unchanged; positive integer = cap; -1 = unlimited.
  string tool_loop_max_iterations = 23;
  // mistral.rs runtime settings (Runtime tab). Sparse-patch: "" = unchanged.
  // These take effect on runtime restart.
  string mistralrs_isq = 24;                 // "-" clears; else ISQ level (e.g. Q4K, Q8_0, AFQ4)
  string mistralrs_paged_attn = 25;          // "auto" | "on" | "off"
  string mistralrs_pa_memory_fraction = 26;  // "-" clears; else 0 < f <= 1 (KV-cache budget)
  // Agent lifecycle. Sparse-patch: "" = unchanged, "true"/"false".
  // Controls whether a CLI-auto-launched agent exits when its last client detaches.
  string agent_shutdown_on_last_client = 28;
}

// Runtime configuration update response.
message UpdateConfigResponse {
  bool success = 1;
  string message = 2;
}

// The response message for ProcessRequest.
message ProcessRequestResponse {
  string output = 1; // AI generated output
  repeated FileChange file_changes = 2; // Optional structured file modifications
  RoutingMetadata routing_metadata = 3; // Optional metadata about the model/routing
  string validation_errors = 4; // Optional captured validation errors (e.g. test failures)
  int32 input_tokens = 5; // Prompt tokens consumed
  int32 output_tokens = 6; // Completion tokens generated
  // Non-fatal informational message from the agent (e.g. "cloud was unavailable —
  // answered locally"). Clients render this as a system entry so the user always
  // knows when routing did something different than the SmartRouter requested.
  string notice = 7;
}

// Represents a change to a specific file.
message FileChange {
  string path = 1;      // File path (relative to work_dir)
  string content = 2;   // New file content
  FileAction action = 3; // Type of action to perform
}

// Possible actions for a FileChange.
enum FileAction {
  CREATE = 0;
  UPDATE = 1;
  DELETE = 2;
}

// Metadata about the routing and model execution.
message RoutingMetadata {
  string model_name = 1; // Name of the model that processed the request
  float confidence = 2;  // Confidence score for the routing decision
  bool escalated = 3;   // Whether the request was escalated to cloud
  string endpoint = 4;  // Active Ollama endpoint URL that served the request
  bool is_fallback = 5; // Whether the fallback (local) endpoint was used
  bool is_cloud = 6; // Locus: the request was served by the cloud tier
}

// Request to list available models on the active Ollama instance.
message ListModelsRequest {}

// A single model available on an Ollama instance.
message ModelInfo {
  string name = 1;        // Model name (e.g., "qwen3-coder:latest")
  int64 size = 2;         // Model size in bytes
  string modified_at = 3; // Last modified timestamp
}

// Response containing available models.
message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message RuntimeModel {
  string id = 1;
  string display_name = 2;
  string runtime = 3;
  string source = 4;
  string path = 5;
  string format = 6;
  string family = 7;
  string quantization = 8;
  int64 size_bytes = 9;
  string modified_at = 10;
  string download_state = 11;
  string runtime_state = 12;
  bool supports_chat = 13;
  bool supports_embed = 14;
  bool supports_tools = 15;
  bool active = 16;
  string download_url = 17;
  int64 downloaded_bytes = 18;
  int64 download_total_bytes = 19;
  string download_error = 20;
  // catalog_id is set on entries backed by Ollama's public library
  // (as opposed to the hardcoded catalog with direct HuggingFace URLs).
  // Format is "name:tag" — e.g. "qwen2.5-coder:7b". When set, the
  // DownloadRuntimeModel handler uses the OCI blob path via
  // registry.ollama.ai instead of a direct HTTP GET of download_url.
  string catalog_id = 21;
  // RAM-estimation numbers pre-resolved by the server's background
  // warmer (see GetModelRAMEstimate for the on-demand equivalent and
  // the meaning of each field). 0 = not warmed yet — clients fall
  // back to the RPC.
  int64 kv_bytes_per_token = 22;
  int64 max_context_tokens = 23;
}

message RuntimeInstance {
  string id = 1;
  string runtime = 2;
  string model_id = 3;
  string state = 4;
  int32 pid = 5;
  string address = 6;
  int32 port = 7;
  string endpoint = 8;
  string started_at = 9;
  string ready_at = 10;
  int32 restart_count = 11;
  int32 last_exit_code = 12;
  string last_error = 13;
  string log_path = 14;
}

message RuntimeEndpoint {
  string id = 1;
  string kind = 2;
  string display_name = 3;
  string base_url = 4;
  string scope = 5;
  string state = 6;
  repeated string active_roles = 7;
  repeated string models = 8;
  string last_checked_at = 9;
  int64 latency_ms = 10;
  string last_error = 11;
  string auth_state = 12;
}

message RuntimeLogEntry {
  string timestamp = 1;
  string source = 2;
  string level = 3;
  string runtime_id = 4;
  string model_id = 5;
  string message = 6;
}

message GetRuntimeStatusRequest {}
message GetRuntimeStatusResponse {
  repeated RuntimeModel models = 1;
  repeated RuntimeInstance instances = 2;
  repeated RuntimeEndpoint endpoints = 3;
  repeated RuntimeLogEntry logs = 4;
}

message ListRuntimeModelsRequest {}
message ListRuntimeModelsResponse {
  repeated RuntimeModel models = 1;
  // catalog_updated_at is the RFC3339 timestamp of the last successful
  // online-catalog fetch. Empty string means the server hasn't
  // successfully fetched yet (first run or repeated failures). The
  // dashboard uses this to render "Catalog updated Nh ago" and to
  // decide when to switch to a stale/error color.
  string catalog_updated_at = 2;
  // system_ram_bytes is the machine's total physical memory so the
  // client can render fit verdicts for embedded estimates without a
  // per-model RPC. 0 when the platform probe fails.
  int64 system_ram_bytes = 3;
  // recommended_open_models maps each capability tier
  // (most_capable, everyday, fast_light, fast_light_text, embedding)
  // to the curated open model the server recommends for this machine's
  // RAM, keyed by the stable inventory id "llama_server:catalog:<bareID>".
  // Empty when the curated catalog fails to load. The setup wizard uses
  // this to autofill the open tier picks with gate-compatible models.
  map<string, string> recommended_open_models = 4;
}

// GetModelRAMEstimate resolves the numbers a client needs to predict
// a model's runtime memory at arbitrary context sizes:
//
//   total(ctx) ~= weights_bytes + ctx * kv_bytes_per_token + overhead
//
// For online catalog entries (catalog_id set) this costs at most one
// manifest fetch plus a 256 KiB ranged blob fetch; results are cached
// by digest so repeat calls are free. For downloaded models (runtime +
// model_id set) the GGUF header is read straight off disk.
message GetModelRAMEstimateRequest {
  // catalog_id selects an online catalog entry ("name:tag"; a bare
  // family name is normalized to ":latest" server-side). Mutually
  // exclusive with runtime/model_id.
  string catalog_id = 1;
  // runtime + model_id select a model already in the local inventory.
  string runtime = 2;
  string model_id = 3;
}
message GetModelRAMEstimateResponse {
  int64 weights_bytes = 1;
  int64 kv_bytes_per_token = 2;
  int64 max_context_tokens = 3;
  string architecture = 4;
  // system_ram_bytes is the machine's total physical memory, so the
  // client can render a fit verdict without a second RPC. 0 when the
  // platform probe fails.
  int64 system_ram_bytes = 5;
  // error is set (empty on success) so clients can degrade to a
  // size-only display instead of handling an RPC failure.
  string error = 6;
}

// RefreshOnlineCatalog force-refreshes the cached model catalog.
// Blocks until the fetch completes so the CLI can update its display
// immediately on return.
message RefreshOnlineCatalogRequest {}
message RefreshOnlineCatalogResponse {
  // catalog_updated_at is the RFC3339 timestamp of the just-completed
  // fetch. Empty on failure — see error for the reason.
  string catalog_updated_at = 1;
  // model_count is the number of families the fetch pulled from
  // Ollama's library, so the CLI can flash a "12 new models" note.
  int32 model_count = 2;
  // error is set (empty on success) so the CLI can render the failure
  // reason next to the previous-fetch timestamp instead of throwing an
  // unhandled RPC error.
  string error = 3;
}

message ListRuntimeEndpointsRequest {}
message ListRuntimeEndpointsResponse { repeated RuntimeEndpoint endpoints = 1; }

message StartRuntimeModelRequest {
  string runtime = 1;
  string model_id = 2;
}
message StartRuntimeModelResponse {
  bool ok = 1;
  string error = 2;
  RuntimeInstance instance = 3;
}

